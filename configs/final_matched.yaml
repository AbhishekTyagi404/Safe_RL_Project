# Step 4 final: matched step sizes, held-out seeds 100..119, 10,000 episodes.
# All asymmetric rules use beta_up = 20 and beta_down = 2, so the ONLY difference between them is
# what decides a move: training data, evaluation data, or a confidence interval on evaluation data.
# The two symmetric rules from step 3 (configs/final.yaml) are kept as reference.
name: final_matched
seeds: 20
seed_offset: 100
n_episodes: 10000
check_every: 50
budget: 0.1
env: {slip: 0.1, step_reward: -1.0, goal_reward: 20.0, max_steps: 100}
agent: {alpha: 0.1, gamma: 0.99, epsilon: 0.1, q_init: 20.0}
methods:
  - {name: standard_sym,       type: standard, beta: 20}
  - {name: gated_sym,          type: gated, bound: hoeffding, beta_up: 100, beta_down: 100, n_eval: 1000}
  - {name: standard_asym,      type: standard, beta_up: 20, beta_down: 2}
  - {name: standard_eval_asym, type: standard, beta_up: 20, beta_down: 2, n_eval: 1000}
  - {name: gated_asym_hoeff,   type: gated, bound: hoeffding,       beta_up: 20, beta_down: 2, n_eval: 1000}
  - {name: gated_asym_cp,      type: gated, bound: clopper_pearson, beta_up: 20, beta_down: 2, n_eval: 1000}
